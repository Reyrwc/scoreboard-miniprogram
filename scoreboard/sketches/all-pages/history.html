<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记分板 - 历史战绩</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-bg); color: var(--color-text); max-width: 390px; min-height: 100vh; margin: 0 auto; -webkit-font-smoothing: antialiased; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    .header { background: var(--color-card); padding: var(--space-lg); text-align: center; border-bottom: 0.5px solid var(--color-border); }
    .header-title { font-size: var(--font-md); font-weight: var(--weight-semibold); }
    .filter-tabs { display: flex; padding: var(--space-md) var(--space-lg); gap: var(--space-sm); }
    .filter-tab { padding: var(--space-sm) var(--space-lg); border-radius: 20px; font-size: var(--font-sm); font-weight: var(--weight-medium); white-space: nowrap; cursor: pointer; border: none; font-family: var(--font-family); transition: all var(--transition-fast); }
    .filter-tab.active { background: var(--color-primary); color: white; }
    .filter-tab:not(.active) { background: var(--color-card); color: var(--color-text-secondary); }
    .date-group { padding: 0 var(--space-lg); margin-bottom: var(--space-lg); }
    .date-label { font-size: var(--font-sm); font-weight: var(--weight-semibold); color: var(--color-text-secondary); margin-bottom: var(--space-sm); padding-left: var(--space-xs); }
    .history-card { background: var(--color-card); border-radius: var(--radius-md); overflow: hidden; margin-bottom: var(--space-sm); cursor: pointer; transition: background var(--transition-fast); }
    .history-card:active { background: var(--color-bg-secondary); }
    .history-header { padding: var(--space-lg); display: flex; justify-content: space-between; align-items: flex-start; }
    .history-title { font-size: var(--font-base); font-weight: var(--weight-semibold); }
    .history-time { font-size: var(--font-xs); color: var(--color-text-tertiary); }
    .history-badge { padding: 2px 8px; border-radius: 4px; font-size: var(--font-xs); font-weight: var(--weight-medium); }
    .badge-win { background: #e8f8ed; color: var(--color-success); }
    .badge-lose { background: #ffe8e8; color: var(--color-danger); }
    .history-players { padding: 0 var(--space-lg) var(--space-lg); display: flex; gap: var(--space-md); }
    .player-chip { display: flex; align-items: center; gap: 6px; font-size: var(--font-sm); }
    .player-mini-avatar { width: 24px; height: 24px; border-radius: var(--radius-full); background: var(--color-bg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: var(--weight-medium); }
    .player-score { font-weight: var(--weight-semibold); }
    .player-score.positive { color: var(--color-success); }
    .player-score.negative { color: var(--color-danger); }
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: var(--color-card); border-top: 0.5px solid var(--color-border); display: flex; padding: var(--space-sm) 0; padding-bottom: calc(var(--space-sm) + env(safe-area-inset-bottom)); }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--space-xs) 0; color: var(--color-text-secondary); text-decoration: none; cursor: pointer; }
    .tab-item.active { color: var(--color-primary); }
    .tab-icon svg { width: 24px; height: 24px; }
    .tab-label { font-size: var(--font-xs); }
  </style>
</head>
<body>
  <div class="header"><div class="header-title">历史战绩</div></div>
  <div class="filter-tabs">
    <button class="filter-tab active">全部</button>
    <button class="filter-tab">本周</button>
    <button class="filter-tab">本月</button>
    <button class="filter-tab">胜场</button>
  </div>
  <div class="date-group">
    <div class="date-label">今天</div>
    <div class="history-card" onclick="location.href='history-detail.html'">
      <div class="history-header">
        <div><div class="history-title">牌桌江湖</div><div class="history-time">20:30 · 4人 · 4局</div></div>
        <span class="history-badge badge-win">胜</span>
      </div>
      <div class="history-players">
        <div class="player-chip"><div class="player-mini-avatar">张</div><span class="player-score positive">+50</span></div>
        <div class="player-chip"><div class="player-mini-avatar">李</div><span class="player-score positive">+30</span></div>
        <div class="player-chip"><div class="player-mini-avatar">王</div><span class="player-score negative">-20</span></div>
        <div class="player-chip"><div class="player-mini-avatar">赵</div><span class="player-score negative">-60</span></div>
      </div>
    </div>
  </div>
  <div class="date-group">
    <div class="date-label">昨天</div>
    <div class="history-card" onclick="location.href='history-detail.html'">
      <div class="history-header">
        <div><div class="history-title">欢乐麻将局</div><div class="history-time">21:15 · 3人 · 6局</div></div>
        <span class="history-badge badge-win">胜</span>
      </div>
      <div class="history-players">
        <div class="player-chip"><div class="player-mini-avatar">张</div><span class="player-score positive">+120</span></div>
        <div class="player-chip"><div class="player-mini-avatar">李</div><span class="player-score negative">-50</span></div>
        <div class="player-chip"><div class="player-mini-avatar">王</div><span class="player-score negative">-70</span></div>
      </div>
    </div>
    <div class="history-card" onclick="location.href='history-detail.html'">
      <div class="history-header">
        <div><div class="history-title">周末斗地主</div><div class="history-time">19:00 · 3人 · 3局</div></div>
        <span class="history-badge badge-lose">负</span>
      </div>
      <div class="history-players">
        <div class="player-chip"><div class="player-mini-avatar">张</div><span class="player-score negative">-30</span></div>
        <div class="player-chip"><div class="player-mini-avatar">李</div><span class="player-score positive">+80</span></div>
        <div class="player-chip"><div class="player-mini-avatar">王</div><span class="player-score negative">-50</span></div>
      </div>
    </div>
  </div>
  <nav class="tab-bar">
    <a class="tab-item" href="index.html"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span><span class="tab-label">首页</span></a>
    <a class="tab-item active" href="profile.html"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span><span class="tab-label">我的</span></a>
  </nav>
</body>
</html>
