<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记分板 - 战绩详情</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-bg); color: var(--color-text); max-width: 390px; min-height: 100vh; margin: 0 auto; -webkit-font-smoothing: antialiased; }
    .navbar { background: var(--color-card); padding: var(--space-lg); display: flex; align-items: center; gap: var(--space-md); border-bottom: 0.5px solid var(--color-border); }
    .nav-back { color: var(--color-primary); cursor: pointer; display: flex; align-items: center; }
    .nav-back svg { width: 24px; height: 24px; }
    .nav-info { flex: 1; }
    .nav-title { font-size: var(--font-md); font-weight: var(--weight-semibold); }
    .nav-subtitle { font-size: var(--font-xs); color: var(--color-text-secondary); }
    .nav-action { font-size: var(--font-sm); color: var(--color-primary); cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .nav-action svg { width: 18px; height: 18px; }
    .room-info { background: var(--color-card); margin: var(--space-lg); border-radius: var(--radius-md); padding: var(--space-lg); text-align: center; }
    .room-name { font-size: var(--font-xl); font-weight: var(--weight-bold); margin-bottom: var(--space-xs); }
    .room-date { font-size: var(--font-sm); color: var(--color-text-secondary); }
    .stats-row { display: flex; gap: var(--space-sm); padding: 0 var(--space-lg); margin-bottom: var(--space-lg); }
    .stat-card { flex: 1; background: var(--color-card); border-radius: var(--radius-md); padding: var(--space-lg) var(--space-sm); text-align: center; }
    .stat-value { font-size: var(--font-xl); font-weight: var(--weight-bold); color: var(--color-primary); }
    .stat-label { font-size: var(--font-xs); color: var(--color-text-secondary); margin-top: var(--space-xs); }
    .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 var(--space-lg); margin-bottom: var(--space-sm); }
    .section-title { font-size: var(--font-sm); font-weight: var(--weight-semibold); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .rank-list { margin: 0 var(--space-lg) var(--space-lg); background: var(--color-card); border-radius: var(--radius-md); overflow: hidden; }
    .rank-item { display: flex; align-items: center; padding: var(--space-lg); border-bottom: 0.5px solid var(--color-border-light); }
    .rank-item:last-child { border-bottom: none; }
    .rank-position { width: 28px; font-size: var(--font-md); font-weight: var(--weight-bold); color: var(--color-text-secondary); text-align: center; }
    .rank-position.top-1 { color: var(--color-warning); }
    .rank-position.top-2 { color: #c0c0c0; }
    .rank-position.top-3 { color: #cd7f32; }
    .rank-avatar { width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--color-bg); display: flex; align-items: center; justify-content: center; font-size: var(--font-base); font-weight: var(--weight-semibold); margin: 0 var(--space-md); }
    .rank-info { flex: 1; }
    .rank-name { font-size: var(--font-base); font-weight: var(--weight-medium); }
    .rank-detail { font-size: var(--font-xs); color: var(--color-text-secondary); margin-top: 2px; }
    .rank-score { font-size: var(--font-md); font-weight: var(--weight-bold); }
    .rank-score.positive { color: var(--color-success); }
    .rank-score.negative { color: var(--color-danger); }
    .record-card { margin: 0 var(--space-lg) var(--space-lg); background: var(--color-card); border-radius: var(--radius-md); overflow: hidden; }
    .record-item { display: flex; align-items: center; padding: var(--space-md) var(--space-lg); border-bottom: 0.5px solid var(--color-border-light); }
    .record-item:last-child { border-bottom: none; }
    .record-from, .record-to { font-size: var(--font-sm); font-weight: var(--weight-medium); }
    .record-arrow { margin: 0 var(--space-sm); color: var(--color-text-tertiary); }
    .record-note { font-size: var(--font-sm); color: var(--color-text-secondary); margin-left: auto; }
    .record-amount { font-size: var(--font-sm); font-weight: var(--weight-semibold); margin-left: var(--space-md); min-width: 40px; text-align: right; }
    .record-amount.positive { color: var(--color-success); }
    .round-divider { padding: var(--space-sm) var(--space-lg); background: var(--color-bg-secondary); font-size: var(--font-xs); font-weight: var(--weight-semibold); color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-light); }
    .bottom-bar { position: sticky; bottom: 0; background: var(--color-card); padding: var(--space-lg); border-top: 0.5px solid var(--color-border); }
    .btn-share { width: 100%; background: var(--color-primary); color: white; border: none; border-radius: var(--radius-md); padding: 14px; font-size: var(--font-md); font-weight: var(--weight-semibold); cursor: pointer; font-family: var(--font-family); display: flex; align-items: center; justify-content: center; gap: var(--space-sm); }
    .btn-share:active { opacity: 0.7; }
    .btn-share svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="navbar">
    <a class="nav-back" href="history.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <div class="nav-info">
      <div class="nav-title">牌桌江湖</div>
      <div class="nav-subtitle">今天 20:30 · 4人</div>
    </div>
    <span class="nav-action">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      分享
    </span>
  </div>
  
  <div class="room-info">
    <div class="room-name">牌桌江湖</div>
    <div class="room-date">今天 20:30 · 4人</div>
  </div>
  
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value">4</div>
      <div class="stat-label">总轮次</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">4</div>
      <div class="stat-label">玩家数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">12</div>
      <div class="stat-label">总记分</div>
    </div>
  </div>
  
  <div class="section-header">
    <span class="section-title">最终排名</span>
  </div>
  <div class="rank-list">
    <div class="rank-item">
      <div class="rank-position top-1">1</div>
      <div class="rank-avatar">张</div>
      <div class="rank-info">
        <div class="rank-name">张三</div>
        <div class="rank-detail">赢4次 · 输0次</div>
      </div>
      <div class="rank-score positive">+50</div>
    </div>
    <div class="rank-item">
      <div class="rank-position top-2">2</div>
      <div class="rank-avatar">李</div>
      <div class="rank-info">
        <div class="rank-name">李四</div>
        <div class="rank-detail">赢3次 · 输1次</div>
      </div>
      <div class="rank-score positive">+30</div>
    </div>
    <div class="rank-item">
      <div class="rank-position top-3">3</div>
      <div class="rank-avatar">王</div>
      <div class="rank-info">
        <div class="rank-name">王五</div>
        <div class="rank-detail">赢1次 · 输3次</div>
      </div>
      <div class="rank-score negative">-20</div>
    </div>
    <div class="rank-item">
      <div class="rank-position">4</div>
      <div class="rank-avatar">赵</div>
      <div class="rank-info">
        <div class="rank-name">赵六</div>
        <div class="rank-detail">赢0次 · 输4次</div>
      </div>
      <div class="rank-score negative">-60</div>
    </div>
  </div>
  
  <div class="section-header">
    <span class="section-title">记分记录</span>
  </div>
  <div class="record-card">
    <div class="round-divider">第4局</div>
    <div class="record-item">
      <span class="record-from">张三</span>
      <span class="record-arrow">→</span>
      <span class="record-to">李四</span>
      <span class="record-note">自摸</span>
      <span class="record-amount positive">+10</span>
    </div>
    <div class="record-item">
      <span class="record-from">王五</span>
      <span class="record-arrow">→</span>
      <span class="record-to">张三</span>
      <span class="record-note">杠</span>
      <span class="record-amount positive">+5</span>
    </div>
    <div class="round-divider">第3局</div>
    <div class="record-item">
      <span class="record-from">赵六</span>
      <span class="record-arrow">→</span>
      <span class="record-to">张三</span>
      <span class="record-note">点炮</span>
      <span class="record-amount positive">+8</span>
    </div>
    <div class="record-item">
      <span class="record-from">李四</span>
      <span class="record-arrow">→</span>
      <span class="record-to">王五</span>
      <span class="record-note">自摸</span>
      <span class="record-amount positive">+12</span>
    </div>
  </div>
  
  <div class="bottom-bar">
    <button class="btn-share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      分享战绩
    </button>
  </div>
</body>
</html>
