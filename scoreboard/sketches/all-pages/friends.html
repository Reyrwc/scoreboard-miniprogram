<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记分板 - 好友排行</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-bg); color: var(--color-text); max-width: 390px; min-height: 100vh; margin: 0 auto; -webkit-font-smoothing: antialiased; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    .header { background: var(--color-card); padding: var(--space-lg); text-align: center; border-bottom: 0.5px solid var(--color-border); }
    .header-title { font-size: var(--font-md); font-weight: var(--weight-semibold); }
    .sort-tabs { display: flex; padding: var(--space-md) var(--space-lg); gap: var(--space-sm); }
    .sort-tab { flex: 1; padding: var(--space-sm); border-radius: var(--radius-sm); font-size: var(--font-sm); font-weight: var(--weight-medium); text-align: center; cursor: pointer; border: none; font-family: var(--font-family); transition: all var(--transition-fast); }
    .sort-tab.active { background: var(--color-primary); color: white; }
    .sort-tab:not(.active) { background: var(--color-card); color: var(--color-text-secondary); }
    .top-three { display: flex; justify-content: center; align-items: flex-end; gap: var(--space-md); padding: var(--space-xl) var(--space-lg); margin-bottom: var(--space-md); }
    .top-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .top-item:nth-child(2) { order: -1; }
    .top-avatar { width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--color-bg); display: flex; align-items: center; justify-content: center; font-size: var(--font-lg); font-weight: var(--weight-semibold); margin-bottom: var(--space-sm); position: relative; }
    .top-item:nth-child(2) .top-avatar { width: 64px; height: 64px; background: linear-gradient(135deg, #ffd700, #ffed4e); }
    .top-crown { position: absolute; top: -12px; font-size: 20px; }
    .top-name { font-size: var(--font-sm); font-weight: var(--weight-medium); margin-bottom: 2px; }
    .top-score { font-size: var(--font-xs); color: var(--color-text-secondary); }
    .top-rank { font-size: var(--font-lg); font-weight: var(--weight-bold); margin-bottom: var(--space-xs); }
    .top-rank.gold { color: #ffd700; }
    .top-rank.silver { color: #c0c0c0; }
    .top-rank.bronze { color: #cd7f32; }
    .rank-list { margin: 0 var(--space-lg); background: var(--color-card); border-radius: var(--radius-md); overflow: hidden; }
    .rank-item { display: flex; align-items: center; padding: var(--space-md) var(--space-lg); border-bottom: 0.5px solid var(--color-border-light); cursor: pointer; transition: background var(--transition-fast); }
    .rank-item:last-child { border-bottom: none; }
    .rank-item:active { background: var(--color-bg-secondary); }
    .rank-position { width: 24px; font-size: var(--font-base); font-weight: var(--weight-bold); color: var(--color-text-secondary); text-align: center; }
    .rank-avatar { width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--color-bg); display: flex; align-items: center; justify-content: center; font-size: var(--font-base); font-weight: var(--weight-semibold); margin: 0 var(--space-md); }
    .rank-info { flex: 1; }
    .rank-name { font-size: var(--font-base); font-weight: var(--weight-medium); }
    .rank-meta { font-size: var(--font-xs); color: var(--color-text-secondary); margin-top: 2px; }
    .rank-winrate { font-size: var(--font-md); font-weight: var(--weight-bold); }
    .section-title { font-size: var(--font-sm); font-weight: var(--weight-semibold); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; padding: var(--space-lg) var(--space-lg) var(--space-sm); }
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: var(--color-card); border-top: 0.5px solid var(--color-border); display: flex; padding: var(--space-sm) 0; padding-bottom: calc(var(--space-sm) + env(safe-area-inset-bottom)); }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--space-xs) 0; color: var(--color-text-secondary); text-decoration: none; cursor: pointer; }
    .tab-item.active { color: var(--color-primary); }
    .tab-icon svg { width: 24px; height: 24px; }
    .tab-label { font-size: var(--font-xs); }
  </style>
</head>
<body>
  <div class="header"><div class="header-title">好友排行</div></div>
  <div class="sort-tabs">
    <button class="sort-tab active">胜率</button>
    <button class="sort-tab">总场次</button>
    <button class="sort-tab">净得分</button>
  </div>
  <div class="top-three">

  </div>
  <div class="section-title">全部好友</div>
  <div class="rank-list">

      <div class="rank-winrate">44.4%</div>
    </div>
  </div>

    <a class="tab-item active" href="profile.html"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span><span class="tab-label">我的</span></a>
  </nav>
</body>
</html>
