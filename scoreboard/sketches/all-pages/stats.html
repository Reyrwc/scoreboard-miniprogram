<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记分板 - 个人统计</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-bg); color: var(--color-text); max-width: 390px; min-height: 100vh; margin: 0 auto; -webkit-font-smoothing: antialiased; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    .header { background: var(--color-card); padding: var(--space-lg); text-align: center; border-bottom: 0.5px solid var(--color-border); }
    .header-title { font-size: var(--font-md); font-weight: var(--weight-semibold); }
    .overview-card { background: var(--color-primary); margin: var(--space-lg); border-radius: var(--radius-md); padding: var(--space-xl); color: white; }
    .overview-label { font-size: var(--font-sm); opacity: 0.8; margin-bottom: var(--space-xs); }
    .overview-value { font-size: var(--font-3xl); font-weight: var(--weight-bold); }
    .overview-sub { font-size: var(--font-sm); opacity: 0.8; margin-top: var(--space-xs); }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-sm); padding: 0 var(--space-lg); margin-bottom: var(--space-lg); }
    .stat-card { background: var(--color-card); border-radius: var(--radius-md); padding: var(--space-lg); }
    .stat-label { font-size: var(--font-sm); color: var(--color-text-secondary); margin-bottom: var(--space-xs); }
    .stat-value { font-size: var(--font-xl); font-weight: var(--weight-bold); }
    .stat-value.positive { color: var(--color-success); }
    .stat-value.negative { color: var(--color-danger); }
    .detail-list { margin: 0 var(--space-lg) var(--space-lg); background: var(--color-card); border-radius: var(--radius-md); overflow: hidden; }
    .detail-item { display: flex; justify-content: space-between; align-items: center; padding: var(--space-lg); border-bottom: 0.5px solid var(--color-border-light); }
    .detail-item:last-child { border-bottom: none; }
    .detail-label { font-size: var(--font-base); color: var(--color-text); }
    .detail-value { font-size: var(--font-base); font-weight: var(--weight-semibold); }
    .section-title { font-size: var(--font-sm); font-weight: var(--weight-semibold); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 var(--space-lg); margin-bottom: var(--space-sm); }
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: var(--color-card); border-top: 0.5px solid var(--color-border); display: flex; padding: var(--space-sm) 0; padding-bottom: calc(var(--space-sm) + env(safe-area-inset-bottom)); }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--space-xs) 0; color: var(--color-text-secondary); text-decoration: none; cursor: pointer; }
    .tab-item.active { color: var(--color-primary); }
    .tab-icon svg { width: 24px; height: 24px; }
    .tab-label { font-size: var(--font-xs); }
  </style>
</head>
<body>
  <div class="header"><div class="header-title">个人统计</div></div>
  <div class="overview-card">
    <div class="overview-label">总胜率</div>
    <div class="overview-value">53.6%</div>
    <div class="overview-sub">28 场比赛 · 15 胜 13 负</div>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">总得分</div><div class="stat-value positive">+1,280</div></div>
    <div class="stat-card"><div class="stat-label">总失分</div><div class="stat-value negative">-860</div></div>
    <div class="stat-card"><div class="stat-label">净得分</div><div class="stat-value positive">+420</div></div>
    <div class="stat-card"><div class="stat-label">最高连胜</div><div class="stat-value">5</div></div>
  </div>
  <div class="section-title">详细数据</div>
  <div class="detail-list">
    <div class="detail-item"><span class="detail-label">最大单局赢分</span><span class="detail-value positive">+350</span></div>
    <div class="detail-item"><span class="detail-label">最大单局输分</span><span class="detail-value negative">-200</span></div>
    <div class="detail-item"><span class="detail-label">平均每局得分</span><span class="detail-value positive">+15</span></div>
    <div class="detail-item"><span class="detail-label">最常用房间</span><span class="detail-value">牌桌江湖</span></div>
    <div class="detail-item"><span class="detail-label">最常一起玩</span><span class="detail-value">李四</span></div>
  </div>
  <nav class="tab-bar">
    <a class="tab-item" href="index.html"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span><span class="tab-label">首页</span></a>
    <a class="tab-item active" href="profile.html"><span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span><span class="tab-label">我的</span></a>
  </nav>
</body>
</html>
