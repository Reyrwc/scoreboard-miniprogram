<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>记分板 - 我的</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--color-bg); color: var(--color-text); max-width: 390px; min-height: 100vh; margin: 0 auto; -webkit-font-smoothing: antialiased; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    .header { background: var(--color-card); padding: var(--space-lg); text-align: center; border-bottom: 0.5px solid var(--color-border); }
    .header-title { font-size: var(--font-md); font-weight: var(--weight-semibold); }
    .profile-card { background: var(--color-card); margin: var(--space-lg); border-radius: var(--radius-md); padding: var(--space-xl); display: flex; align-items: center; gap: var(--space-lg); }
    .avatar-wrapper { position: relative; }
    .avatar { width: 72px; height: 72px; border-radius: var(--radius-full); background: var(--color-primary-light); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: var(--weight-semibold); }
    .avatar-edit { position: absolute; bottom: 0; right: 0; width: 24px; height: 24px; background: var(--color-primary); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
    .avatar-edit svg { width: 14px; height: 14px; }
    .profile-info { flex: 1; }
    .profile-name { font-size: var(--font-xl); font-weight: var(--weight-bold); margin-bottom: var(--space-xs); }
    .profile-id { font-size: var(--font-sm); color: var(--color-text-secondary); }
    .profile-edit { color: var(--color-primary); font-size: var(--font-sm); cursor: pointer; }
    .quick-stats { display: flex; gap: var(--space-sm); padding: 0 var(--space-lg); margin-bottom: var(--space-lg); }
    .quick-stat { flex: 1; background: var(--color-card); border-radius: var(--radius-md); padding: var(--space-lg) var(--space-sm); text-align: center; }
    .quick-stat-value { font-size: var(--font-lg); font-weight: var(--weight-bold); }
    .quick-stat-label { font-size: var(--font-xs); color: var(--color-text-secondary); margin-top: var(--space-xs); }
    .menu-section { margin-bottom: var(--space-lg); }
    .menu-title { font-size: var(--font-sm); font-weight: var(--weight-semibold); color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 var(--space-lg); margin-bottom: var(--space-sm); }
    .menu-list { margin: 0 var(--space-lg); background: var(--color-card); border-radius: var(--radius-md); overflow: hidden; }
    .menu-item { display: flex; align-items: center; padding: var(--space-lg); border-bottom: 0.5px solid var(--color-border-light); cursor: pointer; transition: background var(--transition-fast); }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: var(--color-bg-secondary); }
    .menu-icon { width: 28px; margin-right: var(--space-md); display: flex; align-items: center; justify-content: center; }
    .menu-icon svg { width: 20px; height: 20px; color: var(--color-text-secondary); }
    .menu-label { flex: 1; font-size: var(--font-base); }
    .menu-value { font-size: var(--font-sm); color: var(--color-text-secondary); }
    .menu-arrow { color: var(--color-text-tertiary); margin-left: var(--space-sm); }
    .menu-arrow svg { width: 18px; height: 18px; }
    .menu-item.danger .menu-label { color: var(--color-danger); }
    .menu-item.danger .menu-icon svg { color: var(--color-danger); }
    .version-info { text-align: center; padding: var(--space-xl); font-size: var(--font-xs); color: var(--color-text-tertiary); }
    .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: var(--color-card); border-top: 0.5px solid var(--color-border); display: flex; padding: var(--space-sm) 0; padding-bottom: calc(var(--space-sm) + env(safe-area-inset-bottom)); }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--space-xs) 0; color: var(--color-text-secondary); text-decoration: none; cursor: pointer; }
    .tab-item.active { color: var(--color-primary); }
    .tab-icon svg { width: 24px; height: 24px; }
    .tab-label { font-size: var(--font-xs); }
  </style>
</head>
